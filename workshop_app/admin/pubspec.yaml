name: admin
description: A new Flutter project.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=2.19.2 <3.0.0'

dependencies:
  commons:
    path: ../../workshop_app/commons
  flutter:
    sdk: flutter

  provider: ^6.0.5
  http: ^0.13.5
  json_serializable: ^6.6.1
  percent_indicator: ^4.2.2
  flinq: ^2.0.2
  darq: ^1.2.1
